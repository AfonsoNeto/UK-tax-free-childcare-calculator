<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Tax-Free Childcare Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .card {
      background-color: white;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      padding: 2rem;
      transition: all 0.3s ease-in-out;
    }
    .card:hover {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .input-group {
      margin-bottom: 1.5rem;
    }
    .label {
      display: block;
      color: #4A5568;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .input, .select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.375rem;
      border: 1px solid #E2E8F0;
      background-color: #F7FAFC;
      transition: border-color 0.2s;
    }
    .input:focus, .select:focus {
      outline: none;
      border-color: #4299E1;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
    }
    .day-rate-input {
      display: flex;
      align-items: center;
      margin-top: 0.5rem;
    }
    .day-rate-input input {
      margin-left: 0.5rem;
    }
    .results-card {
      margin-top: 2rem;
      border-top: 3px solid #4299E1;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 1rem 0;
      border-bottom: 1px solid #E2E8F0;
    }
    .result-item:last-child {
      border-bottom: none;
    }
    .result-label {
      font-weight: 500;
      color: #2D3748;
    }
    .result-value {
      font-weight: 700;
      font-size: 1.25rem;
    }
    .result-value.user-pays {
      color: #2F855A;
    }
    .result-value.gov-pays {
      color: #2B6CB0;
    }
    .result-value.total {
      color: #C53030;
    }
    .info-box {
      background-color: #EBF8FF;
      border-left: 4px solid #4299E1;
      padding: 1rem;
      margin-top: 1.5rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      color: #2C5282;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  
  <div class="max-w-4xl w-full mx-auto">
    <div class="card">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Tax-Free Childcare Calculator</h1>
      <p class="text-center text-gray-500 mb-8">Estimate your monthly nursery costs and government contribution.</p>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Left Column: Inputs -->
        <div>
          <!-- Month and Year Selection -->
          <div class="input-group">
            <label for="month-year" class="label">Select Month and Year</label>
            <input type="month" id="month-year" class="input">
          </div>
          
          <!-- Government Contribution Input -->
          <div class="input-group">
            <label for="gov-contribution" class="label">Government Contribution (Current 3-month period)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">£</span>
              <input type="number" id="gov-contribution" class="input pl-8" placeholder="0.00" value="0" min="0" step="0.01">
            </div>
          </div>
          
          <!-- Days of the Week Selection -->
          <div class="input-group">
            <label class="label">Select Nursery Days & Daily Rates</label>
            <div id="days-container" class="space-y-3">
              <!-- JS will populate this -->
            </div>
          </div>
        </div>
        
        <!-- Right Column: Results -->
        <div class="flex flex-col">
          <div id="results-container" class="results-card card flex-grow hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Your Estimated Costs</h2>
            <div id="results-breakdown">
              <!-- JS will populate this -->
            </div>
            <div id="optimization-container" class="mt-6 pt-4 border-t border-gray-200 hidden">
              <h3 class="text-lg font-semibold text-gray-700 text-center mb-2">Maximize Your Benefit</h3>
              <div id="optimization-details" class="text-sm text-center text-gray-600 p-2 bg-indigo-50 rounded-lg">
                <!-- JS will populate this -->
              </div>
            </div>
          </div>
          
          <div class="info-box mt-auto">
            <p>The government contributes 20% of your childcare costs, up to a maximum of £500 every 3 months (£2,000 a year) for each child.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
